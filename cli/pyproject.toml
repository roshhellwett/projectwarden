[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zenith-passkeys"
version = "1.0.0"
description = "Local-first passkey manager with encrypted vault"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Zenith Passkeys Contributors"}]
keywords = ["passkeys", "webauthn", "fido2", "password-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "cryptography>=43.0",
    "platformdirs>=4.0",
    "filelock>=3.13",
    "cbor2>=5.6",
    "rich>=13.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
gdrive = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
onedrive = [
    "msal>=1.28",
    "requests>=2.31",
]
all = ["zenith-passkeys[gdrive,onedrive]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
zenith-passkeys = "zenith_passkeys.main:cli"
zenith-passkeys-host = "zenith_passkeys.native_host.host:main"

[project.urls]
Homepage = "https://github.com/user/zenith-passkeys"
Repository = "https://github.com/user/zenith-passkeys"
